<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Taco HTML Preview Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f1ea;
      color: #171817;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; padding: clamp(24px, 7vw, 72px); background: radial-gradient(circle at 78% 12%, #d9f7e9 0, transparent 30%), #f4f1ea; }
    main { width: min(100%, 920px); margin: 0 auto; }
    .eyebrow { margin: 0 0 12px; color: #08754a; font-size: 12px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(42px, 8vw, 84px); line-height: .96; letter-spacing: -.055em; text-wrap: balance; }
    .lede { max-width: 620px; margin: 24px 0 48px; color: #535650; font-size: clamp(17px, 2.4vw, 22px); line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    article { min-height: 190px; padding: 20px; border: 1px solid rgba(23, 24, 23, .12); border-radius: 18px; background: rgba(255, 255, 255, .72); backdrop-filter: blur(10px); }
    .number { display: block; margin-bottom: 54px; color: #08754a; font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    h2 { margin: 0 0 8px; font-size: 18px; letter-spacing: -.02em; }
    article p { margin: 0; color: #62655f; font-size: 14px; line-height: 1.5; }
    footer { display: flex; align-items: center; gap: 10px; margin-top: 28px; color: #62655f; font-size: 12px; }
    .mark { display: inline-grid; grid-template: repeat(2, 8px) / repeat(2, 8px); gap: 2px; width: 18px; height: 18px; }
    .mark i { display: block; border-radius: 50%; background: #3ecf8e; }
    .mark i:nth-child(2) { background: #3b82f6; }
    .mark i:nth-child(3) { grid-column: 2; background: #f97316; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } article { min-height: 0; } .number { margin-bottom: 28px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Self-contained prototype</p>
    <h1>HTML 预览已经有东西可预览了。</h1>
    <p class="lede">这个页面来自默认 Taco 内的真实 HTML 文件。它在独立页面运行，不依赖外部字体、脚本、图片或网络请求。</p>
    <section class="grid" aria-label="预览能力">
      <article><span class="number">01</span><h2>真实文件</h2><p>原型与 Markdown、YAML 和 JSON 一起进入 canonical bundle。</p></article>
      <article><span class="number">02</span><h2>独立运行</h2><p>本地 Taco 在新页面打开真实 HTML 文件，不使用 iframe。</p></article>
      <article><span class="number">03</span><h2>完全离线</h2><p>全部样式与内容都在这个文件中，适合直接验证默认预览流程。</p></article>
    </section>
    <footer><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Taco HTML Preview Demo</footer>
  </main>
</body>
</html>
