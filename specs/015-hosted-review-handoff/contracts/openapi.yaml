openapi: 3.1.0
info:
  title: TACO-33 公开自动保存与人工交接 HTTP 增量契约
  version: 0.2.0-draft
  description: >-
    只规定相对 008 Host 契约新增或改变的接口，不声明当前 Next 路由已实现。
    一个 Taco 仅有一次 Agent publish；发布基线由 Host 内部保存，Agent 无需 revisionId。
    分享 URL 可公开读写，自报姓名及监听资料不是认证；实现仍需同源防护与滥用限制。
servers:
  - url: https://api.taco.local
    description: 正式部署使用 HTTPS；Host origin 由 CLI 明确指定
  - url: http://localhost:32167
    description: 本地回环开发
paths:
  /v1/uploads:
    post:
      operationId: prepareReviewEditUpload
      summary: 为一次自动保存中的单个较大文件预留私有对象
      description: >-
        对 008 上传预留的 purpose=review-edit 扩展，而非 handoff 上传。
        较小文件随 PATCH /state 直接提交；预留上传不得创建可见编辑或交接事件。
        PUT 仅向返回的私有 URL 发送 JSON 文件内容，绝不发送 Host 凭据且不跟随重定向。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, tacoId, payloadBytes, payloadHash]
              properties:
                purpose: { const: review-edit }
                tacoId: { type: string, format: uuid }
                payloadBytes: { type: integer, minimum: 1, maximum: 33554432 }
                payloadHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
      responses:
        '200':
          description: 同键预留或已提交结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditUploadReservation' }
        '201':
          description: 新的私有文件上传预留
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditUploadReservation' }
        '403': { $ref: '#/components/responses/CrossOrigin' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: 单文件或上传包超过上限；不截断 }
  /v1/tacos/{id}/state:
    get:
      operationId: readSharedReviewState
      summary: 读取当前公开共享状态和乐观并发版本
      parameters:
        - $ref: '#/components/parameters/TacoId'
      responses:
        '200':
          description: 已自动保存的最新完整 Taco 状态（不是浏览器未保存改动）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stateVersion, commentsThroughSequence, snapshot]
                properties:
                  stateVersion: { $ref: './handoff.schema.json#/$defs/Sequence' }
                  commentsThroughSequence: { $ref: './handoff.schema.json#/$defs/Sequence' }
                  snapshot: { $ref: '../../008-taco-host-contract/contracts/protocol.schema.json#/$defs/Snapshot' }
        '404': { description: Taco 不存在或旧 paste 无发布基线 }
    patch:
      operationId: autosaveSharedReviewState
      summary: 无鉴权按自报姓名原子自动保存增量文件及 Checkpoint 改动
      description: >-
        页面短暂 debounce 后独立发起；同一 Taco 共用最新状态。
        保存请求按 expectedStateVersion 做 CAS，不能按姓名隔离私有草稿。
        大文件先完成私有文件上传，再在本次事务验证 uploadId 并切换不可变对象指针。
        每次成功保存产生编辑日志/新的 stateVersion，十分钟固定窗口只合并可见历史版本。
        本接口不产生 review.handed_off。
      parameters:
        - $ref: '#/components/parameters/TacoId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './handoff.schema.json#/$defs/AutoSavePatch' }
      responses:
        '200':
          description: 自动保存持久成功；响应返回下次 CAS 所需版本
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stateVersion, savedAt, historyWindowId]
                properties:
                  stateVersion: { $ref: './handoff.schema.json#/$defs/Sequence' }
                  savedAt: { type: string, format: date-time }
                  historyWindowId: { type: string, format: uuid }
        '400': { description: 自报姓名或 patch 参数错误 }
        '403': { $ref: '#/components/responses/CrossOrigin' }
        '404': { description: Taco 不存在或不支持公开编辑 }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: 文件或完整共享状态超限；保留本地改动 }
        '422': { description: 路径、文件媒介、Checkpoint、uploadId 校验失败或删除最后一份文件 }
  /v1/tacos/{id}/history:
    get:
      operationId: listCoalescedHistory
      summary: 读取每十分钟固定窗口聚合的可见历史版本
      parameters:
        - $ref: '#/components/parameters/TacoId'
      responses:
        '200':
          description: 空闲时不生成空版本；交接不生成新历史版本
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, startedAt, closedAt, latestStateVersion]
                      properties:
                        id: { type: string, format: uuid }
                        startedAt: { type: string, format: date-time }
                        closedAt: { type: [string, 'null'], format: date-time }
                        latestStateVersion: { $ref: './handoff.schema.json#/$defs/Sequence' }
        '404': { description: Taco 不存在 }
  /v1/tacos/{id}/history/{windowId}:
    get:
      operationId: readCoalescedHistoryState
      summary: 读取指定十分钟窗口当时的完整文档内容
      description: >-
        窗口未封存时返回该窗口最新的已保存内容；窗口到期封存后返回其最终不可变快照。
        保留历史窗口内容和所引用的私有 Blob，不因之后自动保存或交接被覆盖；
        此接口供查看旧版本，不自动恢复或修改当前共享状态。
      parameters:
        - $ref: '#/components/parameters/TacoId'
        - name: windowId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 该版本实际完整内容；封存窗口的内容不可再改变
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, startedAt, closedAt, latestStateVersion, snapshot]
                properties:
                  id: { type: string, format: uuid }
                  startedAt: { type: string, format: date-time }
                  closedAt: { type: [string, 'null'], format: date-time }
                  latestStateVersion: { $ref: './handoff.schema.json#/$defs/Sequence' }
                  snapshot: { $ref: '../../008-taco-host-contract/contracts/protocol.schema.json#/$defs/Snapshot' }
        '404': { description: 窗口不存在或不属于该 Taco }
  /v1/tacos/{id}/reviews:
    get:
      operationId: readPersistentReviewThreads
      summary: 读取含锚点、作者与完整消息历史的公开评论
      parameters:
        - $ref: '#/components/parameters/TacoId'
      responses:
        '200':
          description: 当前可见的持久评论线程
          content:
            application/json:
              schema:
                type: array
                items: { $ref: './handoff.schema.json#/$defs/CommentThread' }
    post:
      operationId: mutatePersistentReviewThread
      summary: 用自报姓名新建/回复/解决/删除评论，独立于交接
      description: >-
        取代目前只有 body/author 的内存路由。状态与消息持久化，服务端分配作者声明的
        提交时间和共享评论高水位；只发布评论事件，不能发布 review.handed_off。
      parameters:
        - $ref: '#/components/parameters/TacoId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [author, action]
              properties:
                author: { $ref: './handoff.schema.json#/$defs/Name' }
                action: { enum: [create, reply, resolve, reopen, delete] }
                threadId: { type: string, minLength: 1 }
                messageId: { type: string, minLength: 1 }
                anchor:
                  oneOf:
                    - type: 'null'
                    - $ref: '../../008-taco-host-contract/contracts/protocol.schema.json#/$defs/Anchor'
                body: { type: string, minLength: 1, maxLength: 16384 }
              allOf:
                - if: { properties: { action: { const: create } }, required: [action] }
                  then: { required: [anchor, body] }
                  else: { required: [threadId] }
                - if: { properties: { action: { const: reply } }, required: [action] }
                  then: { required: [body] }
                - if: { properties: { action: { const: delete } }, required: [action] }
                  then: { required: [messageId] }
      responses:
        '201': { description: 新评论已保存，但未交接 }
        '200': { description: 回复或状态变更已保存，但未交接 }
        '403': { $ref: '#/components/responses/CrossOrigin' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 无效锚点或线程操作 }
  /v1/tacos/{id}/handoffs:
    post:
      operationId: commitHandoff
      summary: 人点击「交接」后仅从已保存状态生成不可变评审差异
      description: >-
        不上传正文，不在此保存待提交的编辑，不创建/封存历史版本。
        与 expectedStateVersion、expectedCommentsThroughSequence 匹配后，在同一数据库事务
        内冻结上次 publish→最新状态的累计差异、上次交接→本次的增量、完整评论历史，
        保存不可变 payload 引用、幂等收据与 review.handed_off 事件。
        第一次无改动点击仍交接；再次无新增内容则 changed=false。
      parameters:
        - $ref: '#/components/parameters/TacoId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [author, expectedStateVersion, expectedCommentsThroughSequence]
              properties:
                author: { $ref: './handoff.schema.json#/$defs/Name' }
                expectedStateVersion: { $ref: './handoff.schema.json#/$defs/Sequence' }
                expectedCommentsThroughSequence: { $ref: './handoff.schema.json#/$defs/Sequence' }
      responses:
        '201':
          description: Host 持久交接及事件；不表示 Agent 已处理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffCommit' }
        '200':
          description: 同键重试原结果或无新增变化返回 changed=false、event=null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffCommit' }
        '403': { $ref: '#/components/responses/CrossOrigin' }
        '404': { description: Taco 不存在或无 publish 基线 }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: Taco 已删除或过期 }
        '413': { description: 完整冻结 payload 超过服务端明确上限；不得截断 }
  /v1/tacos/{id}/handoffs/{handoffId}:
    get:
      operationId: getHandoff
      summary: 读取按 tacoId 与 handoffId 归属的不可变完整交接
      description: 大响应流式 JSON；不得从后续共享状态拼装旧交接或静默截断。
      parameters:
        - $ref: '#/components/parameters/TacoId'
        - name: handoffId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 持久交接完整快照
          content:
            application/json:
              schema: { $ref: './handoff.schema.json#/$defs/HandoffRecord' }
        '404': { description: 交接不存在或不属于该 Taco }
        '410': { description: Taco 已删除或过期 }
  /v1/tacos/{id}/listeners:
    get:
      operationId: listHandoffListeners
      summary: 列出该 Taco 所有未过期订阅租约与自报信息
      description: >-
        列表仅说明连接存活，不验证任何人或原 Agent，不是已读回执。
        服务端只用枚举映射本地图标；未知值显示通用图标，不能从自报 URL 下载图片。
      parameters:
        - $ref: '#/components/parameters/TacoId'
      responses:
        '200':
          description: 没有监听者时返回空列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [listeners, observedAt]
                properties:
                  observedAt: { type: string, format: date-time }
                  listeners:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [listenerId, lastSeenAt, expiresAt]
                      properties:
                        listenerId: { type: string, format: uuid, description: 临时连接标识，不是会话 id }
                        name: { type: string, minLength: 1, maxLength: 64, description: 自报称呼；缺失时显示匿名监听者 }
                        sessionTitle: { type: string, minLength: 1, maxLength: 256, description: 自报会话标题，用于多会话区分 }
                        harness: { $ref: '#/components/schemas/HarnessName' }
                        model: { $ref: '#/components/schemas/ModelName' }
                        modelId: { type: string, minLength: 1, maxLength: 128, description: 详细模型 id，不作为 Logo 枚举键 }
                        connectedAt: { type: string, format: date-time, description: 租约初次建立连接时间，续租不改变 }
                        lastSeenAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
        '404': { description: Taco 不存在 }
  /v1/tacos/{id}/subscribe:
    get:
      operationId: subscribeWithPresence
      summary: 订阅 Taco 事件并登记可选自报 Harness/Model/Name
      description: >-
        继续沿用 ready/event/checkpoint 与 after 游标。全部元数据可省略；字段是自报的，
        不能用来证明订阅者身份或给其写入权限。每 30 秒续租，90 秒未续租自动失效；
        同一 listenerId 重连不重复显示。评论事件不触发 Handoff。
      parameters:
        - $ref: '#/components/parameters/TacoId'
        - name: after
          in: query
          required: false
          schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        - name: X-Listener-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
        - name: X-Taco-Harness
          in: header
          required: false
          schema: { $ref: '#/components/schemas/HarnessName' }
        - name: X-Taco-Model
          in: header
          required: false
          description: 枚举模型族名称，用于本地 Logo；详细型号另用 X-Taco-Model-Id
          schema: { $ref: '#/components/schemas/ModelName' }
        - name: X-Taco-Model-Id
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: X-Taco-Listener-Name
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: X-Taco-Session
          in: header
          required: false
          description: 自报会话标题，支持百分号编码（percent-encoded UTF-8），服务端解码并校验 1-256 字符
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: SSE 持久事件流；包含 review.handed_off 引用事件
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: 元数据枚举或长度不合法 }
        '404': { description: Taco 不存在 }
        '410': { description: Taco 或 cursor 不可读取，须报告历史缺口 }
components:
  parameters:
    TacoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-Taco-CSRF
      in: header
      required: true
      description: 公开可获取的同源写入保护，不是身份鉴权；服务端还需检查 Origin
      schema: { type: string, minLength: 1 }
  schemas:
    HarnessName:
      type: string
      enum: [codex, claude-code, github-copilot, cursor, agy, pi, omp, openclaw, hermes, opencode, gemini-cli, other]
      description: CLI/Harness 可自报的枚举名称，决定本地 Harness 图标
    ModelName:
      type: string
      enum: [gpt, claude, gemini, other]
      description: 枚举模型族名，映射本地 Logo；不是具体 modelId
    EditUploadReservation:
      description: 与 008 的 pending/committed 上传预留响应保持相同结构，单文件上限 32 MiB
      oneOf:
        - $ref: '../../008-taco-host-contract/contracts/openapi.yaml#/components/schemas/UploadPreparePendingResponse'
        - $ref: '../../008-taco-host-contract/contracts/openapi.yaml#/components/schemas/UploadPrepareCommittedResponse'
    HandoffCommit:
      type: object
      additionalProperties: false
      required: [changed, handoffId, event]
      properties:
        changed: { type: boolean }
        handoffId: { type: [string, 'null'], format: uuid }
        event:
          oneOf:
            - type: 'null'
            - $ref: './handoff.schema.json#/$defs/HandoffEvent'
  responses:
    CrossOrigin:
      description: Origin/公开 CSRF 校验失败；不隐含用户身份认证
    Conflict:
      description: stateVersion/评论高水位冲突，或幂等键被不同请求重用；不覆盖其他人已保存内容
