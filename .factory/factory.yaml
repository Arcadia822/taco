version: 2
name: taco
bind:
  task: linear
  repository: github
  runtime: tern
  workflow:
  - builtin
task:
  scope:
    team: 1f9f0c7f-c3e9-450d-b940-ef15a5cca85e
    project: 3e7ae872-195e-4c3a-83b8-fef25381725e
  states:
    queued: Todo
    running: In Progress
    handoff: In Review
    done: Done
repository:
  scope:
    repo: Arcadia822/taco
    base: main
config_writer: delivery
members:
- id: arcadia
  kind: human
  identities:
    linear: arcadia
services:
  delivery:
    purpose: 处理 Taco 项目带 chore 标签的 Todo issue，按 builtin/develop workflow 交付带验证证据的
      PR
    intake:
      select:
        state:
          name:
            eq: Todo
        labels:
          name:
            eq: chore
      claim:
        by: agent
        state: In Progress
    workflows:
    - ref: builtin/develop
      when: 默认
    run:
      wake: loop
      target: host-c1
      capacity: 1
      model: magpie/group/auto-gpt-6-1-sol
      roles: {}
    control_task: TACO-87
    conventions:
    - PR 正文引用 Linear issue 键
    - 合并后由宿主读回 Linear 状态并设置 Done
    permissions:
      forbid: []
integrations:
  tern:
    targets:
    - id: host-c1
      host: root@100.123.118.1
      root: /data/taco
      tern_host: root@host-c1
      tern_socket: /run/user/0/tern/daemon.sock
    install_roots:
      pstack: /root/.agents/skills
