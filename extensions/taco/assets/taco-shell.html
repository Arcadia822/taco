dels are removed.\n\n## Automated Evidence\n\n- [x] The 30 bundle, security, rendering, save/unpack, and browser-component tests pass.\n- [x] The final single-file production build passes after the spec rewrite.\n- [x] The source directory and the embedded bundle match exactly in file count and content.\n- [ ] A direct `file://` offline browser run issues zero resource requests.\n- [x] The 720px responsive-drawer and horizontal-overflow browser checks pass.\n- [ ] The automated WCAG audit passes on the v0.3 artifact.\n\n## Browser Evidence\n\n- [x] The local HTTP preview opens `README.md` under Specify with 15 files, including the self-contained HTML preview demo, and no leftover entity cards.\n- [x] `tasks.md` navigation, the exact-source toggle, and full-text search work.\n- [x] The browser console reports no errors.\n- [ ] In-app browser automation cannot occupy a `file://` tab because of the local-file security policy; direct file reload is still a manual check.\n\n## Intentionally Deferred\n\n- [x] Markdown WYSIWYG/source editing with no exposed formatting toolbar\n- [x] Structured YAML frontmatter property editing for Markdown; standalone YAML/JSON remain source editors\n- [x] Save and Save a copy UI\n- [ ] Recovery and local version history UI\n- [ ] YAML/JSON/OpenAPI renderers\n- [ ] Derived traceability and Readiness views\n",

      "path": "specs/001-taco-bento-product/contracts/taco-document.md",
      "mediaType": "text/markdown",
      "content": "---\ntitle: \"Taco File Container Contract\"\n---\n\n## Container\n\nThe release artifact is a single self-contained file:\n\n```text\n\u003cname>.taco.html\n```\n\nIt contains the Taco runtime and a single bundle block:\n\n```html\n\u003cscript id=\"taco-document\" type=\"application/taco+json\">\n{\n  \"format\": \"taco/files\",\n  \"version\": 1,\n  \"docId\": \"taco-product-spec\",\n  \"title\": \"Taco product specification\",\n  \"root\": \"specs/001-taco-bento-product\",\n  \"files\": [\n    {\n      \"title\": \"Feature Specification: Taco File Browser\",\n      \"path\": \"specs/001-taco-bento-product/spec.md\",\n      \"mediaType\": \"text/markdown\",\n      \"content\": \"**Feature Directory**: specs/001-taco-bento-product\\n\",\n      \"sourceHash\": \"\u003csha256-of-content-at-pack-time>\"\n    }\n  ]\n}\n\u003c/script>\n```\n\nThe JSON is the container protocol, not a product-spec schema. `content` is the file source of truth.\n\nAn edit invitation may carry the relay room, AES-GCM key, Owner public key, delegated invite, and CRDT snapshot in `collab`; a read-only copy carries only `access: \"reader\"` and drops `collab`. The Owner private key is only allowed to stay in the Owner's own Taco. `collab.role: \"reader\"` in older files is for backward compatibility only and is no longer produced by the share menu.\n\n```mermaid\nflowchart LR\n  A[\"Spec Kit file tree\"] --> B[\"TacoBundle files[]\"]\n  B --> C{\"Validate version, root and path\"}\n  C -- \"valid\" --> D[\"Escape JSON that is safe to embed in HTML\"]\n  D --> E[\"Embed the runtime and #taco-document\"]\n  E --> F[\"Single .taco.html file\"]\n  F --> G[\"Load locally and parse the bundle\"]\n  G --> H[\"Derive the file sidebar, Tiptap, outline and comments\"]\n  C -- \"invalid\" --> I[\"Recovery mode\"]\n```\n\nSaving and reopening both go through the same container path. The rendered HTML, Mermaid SVG, and outline state do not flow back into `files[].content`.\n\nStage navigation adds no bundle fields. Core files and Spec Kit convention files are identified by relative path; other Markdown declares its membership with a `taco_scope: spec|plan|tasks` YAML property. The property remains canonical Markdown and appears in the document property editor. Invalid text remains preserved but does not route. The directory structure continues to be derived from `path`.\n\n## Invariants\n\n- The block must appear exactly once.\n- The bundle `title`'s normalized filename must match the stem of the container `.taco.html`; the HTML `\u003ctitle>` must be derived from the same bundle title.\n- When unpacking in the browser, the user-selected directory is the sidebar file tree root; `files[].path` must have its `${root}/` prefix removed before writing, and the project-level `root` must not be recreated inside the target directory.\n- All paths must be UTF-8 relative paths located under `root/`.\n- Paths must not be duplicated and must not contain `..`, `.`, empty segments, backslashes, or absolute paths.\n- `files[].title` may be omitted; when present it must be a non-empty string. Editing it only changes the display title and must not rewrite `path` or the on-disk filename.\n- `files[].sourceHash` may be omitted; a CLI-created Taco must write a 64-character lowercase hexadecimal SHA-256 representing the canonical file content at pack time. Browser edits must not update this value; it is the bilateral conflict baseline for the next Agent sync.\n- Every HTML/HTM file must have `files[].sourceUrl`. CLI-created Taco files use an absolute `file:` URL with no authority, credentials, query, or fragment whose decoded pathname ends in the validated `files[].path`. The committed showcase shell alone uses the exact `../\u003cfiles[].path>` reference so its generated bytes do not depend on the checkout directory; the runtime resolves that reference only when the Taco itself has a local `file:` URL. Non-HTML files must not carry this field. Invalid bundles enter Recovery mode instead of receiving a generated `data:` or Blob fallback.\n- `pack --from` may accept a legacy Taco whose HTML entry lacks this field solely as migration input; the refreshed output must replace it with the canonical URL before validation or delivery.\n- `files[].sourceUrl` is local transport metadata. Taco omits it from collaboration synchronization and from the public Agent file projection.\n- `content` must be saved verbatim from the file; the renderer must not write back formatted results.\n- A `\u003c` inside a string is safely escaped in the HTML to avoid ending the script block.\n- The runtime does not execute bundle content.\n- The bundle's core reading and editing depend on no external CDN, font, account, or backend; it connects to the relay specified by `collab.room` only when the user explicitly starts online collaboration.\n- Comment messages retain the required version-1 shape and may add `authorId`, `updatedAt`, and `deletedAt`. All timestamps are bounded ISO strings. `deletedAt` is the sole tombstone discriminator; deleted bodies serialize as the fixed non-empty `[Deleted message]` sentinel so older version-1 readers degrade to ordinary visible text instead of rejecting the bundle.\n- Message order is always `createdAt`, then `id`. Editing and deletion update the parent thread activity time without moving a message or deleting siblings. A deleted root or only message does not delete the thread.\n- Live CRDT frames require sync protocol v3. A peer with another protocol version is reported and ignored before operations, presence, or snapshots can partially synchronize.\n\n## Renderer Strategy\n\n| Media type / extension | v0.3 behavior |\n|---|---|\n| `text/markdown`, `.md` | Tiptap WYSIWYG editing + canonical Markdown serialization |\n| `text/html`, `.html`, `.htm` | non-embedded preview card opening the validated canonical `file:` URL in a separate page |\n| YAML, `.yaml`, `.yml` | source only |\n| JSON, `.json` | source only |\n| Other text | source only |\n\nLater renderers are pluggable views and must not change the canonical content.\n\n## Agent Protocol\n\nThe v0.3 Agent can only:\n\n- `listFiles()`\n- `readFile(path)`\n- `search(query)`\n\nFuture write capabilities should use file patches: `writeFile`, `applyPatch`. Renaming files is not a protocol capability; parallel domain APIs such as `addRequirement` or `updateTask` must not be reintroduced.\n\nThe Spec Kit extension's file-level protocol is provided by the offline CLI:\n\n- `pack \u003cfeature-dir>`: read UTF-8 text files, record a `sourceHash`, attach each HTML file's canonical `file:` URL, and create a Taco.\n- `sync \u003ctaco> --dry-run --json`: before writing to disk, return each file's `created | updated | unchanged | conflict` status and all comments.\n- `sync \u003ctaco> --json`: write back to canonical paths only when the full pre-check has no conflict; missing files are not deleted.\n- `comments \u003ctaco> --status open --json`: return comment paths, quotes, line/column, stale status, and ordered messages. Edited messages include `updatedAt`; deleted messages expose `deleted: true`, `deletedAt`, and `body: null` so the sentinel is never presented to an Agent as active feedback.\n\nA conflict is defined as: the target canonical file's current hash differs from both the `sourceHash` and the Taco's `content` hash. When any file conflicts, the default sync is all-or-nothing and writes no other file. `--force` is an explicit manual recovery operation and is not part of the automated Agent flow.\n",
      "title": "Contract: Taco File Bundle v1"
    },
    {
      "path": "specs/001-taco-bento-product/data-model.md",
      "mediaType": "text/markdown",
      "content": "---\ntitle: \"Data Model: File-first Taco Bundle\"\n---\n\n## Principle\n\nTaco v0.3 has only a transport model, no spec domain model. The user stories, requirement numbers, task checkboxes, and success criteria that appear in Markdown remain file content.\n\n```mermaid\nclassDiagram\n  direction LR\n\n  class TacoBundle {\n    +string format\n    +integer version\n    +string docId\n    +string title\n    +string root\n  }\n\n  class TacoFile {\n    +string title\n    +string path\n    +string mediaType\n    +string content\n    +string sourceUrl\n  }\n\n  class TacoCommentThread {\n    +string id\n    +string status\n    +datetime createdAt\n    +datetime updatedAt\n  }\n\n  class TacoTextAnchor {\n    +string path\n    +integer start\n    +integer end\n    +string exact\n    +string prefix\n    +string suffix\n  }\n\n  class TacoCommentMessage {\n    +string id\n    +string author\n    +string authorId\n    +string body\n    +datetime createdAt\n    +datetime updatedAt\n    +datetime deletedAt\n  }\n\n  class TacoCollab {\n    +string room\n    +string key\n    +boolean on\n    +integer v\n    +string owner\n    +string ownerPriv\n    +string role\n    +object invite\n    +object sync\n  }\n\n  TacoBundle \"1\" *-- \"1..*\" TacoFile : files\n  TacoBundle \"1\" *-- \"0..*\" TacoCommentThread : comments\n  TacoBundle \"1\" *-- \"0..1\" TacoCollab : encrypted collaboration\n  TacoCommentThread \"1\" *-- \"1\" TacoTextAnchor : anchor\n  TacoCommentThread \"1\" *-- \"1..*\" TacoCommentMessage : messages\n```\n\nThe diagram shows only the transport objects that enter the single-file container. Stage navigation, the Tiptap document tree, the in-file outline, and search results are not in this persisted relationship diagram.\n\n## TacoBundle\n\n| Field | Type | Rule |\n|---|---|---|\n| `format` | literal | `taco/files` |\n| `version` | positive integer | currently `1` |\n| `docId` | string | the bundle's stable identity |\n| `title` | string | the top-bar display name; once normalized it must equal the persisted `.taco.html` filename stem |\n| `root` | relative path | the feature directory boundary |\n| `files` | `TacoFile[]` | the set of files, sorted by path |\n| `comments` | `TacoCommentThread[]?` | optional local comment threads; saved with the Taco file |\n| `access` | `reader?` | a mandatory read-only marker for an offline packaged copy |\n| `collab` | `TacoCollab?` | an optional room, read key, role credential, and CRDT snapshot; contains no account identity |\n\n## TacoCollab\n\n`room` points to the optional relay, and `key` is the client AES-GCM read capability. An Owner copy keeps `ownerPriv`; an edit invitation keeps only the Owner-signed `invite` delegation; a live viewer keeps only `room`, `key`, `owner`, and `role: reader`. `sync` keeps the version vector and CRDT registers so a reconnecting offline copy can merge instead of overwriting the whole document.\n\nThe display name is stored locally by the browser and sent through encrypted presence. It is not an account or a verified identity; device identities in the member list are distinguished by signed public-key fingerprints.\n\n## TacoFile\n\n| Field | Type | Rule |\n|---|---|---|\n| `title` | string? | an optional in-file display title; must be a non-empty string and must not modify `path` when edited |\n| `path` | string | must sit under `root/`; no absolute paths, backslashes, empty segments, `.`, or `..` |\n| `mediaType` | string | a content format hint that grants no semantic interpretation |\n| `content` | string | the file's raw UTF-8 text |\n| `sourceUrl` | string? | required only for HTML/HTM; CLI packages use the canonical absolute `file:` URL whose decoded pathname ends in `path`; the committed showcase shell alone uses the exact portable `../\u003cpath>` reference so builds are reproducible across checkout locations |\n\n## Derived State\n\nThe following is derived only at runtime and is not written to the bundle:\n\n- stage navigation and role grouping\n- the in-group directory tree such as `contracts/`\n- the current file and viewport state\n- Markdown HTML\n- the H1–H3 page outline (excluding file metadata titles)\n- the search index and results\n- file-type badges\n- comment selection highlights and the currently active thread\n\nFuture task counts, requirement coverage, or readiness may likewise only be parsed from files, and must not become a parallel source of truth.\n\n## Stage Projection\n\nTaco recognizes three core files: `spec.md`, `plan.md`, and `tasks.md`. A feature-root `README.md` enters Specify by convention and is preferred as the opening document, with `spec.md` as the fallback. Known Spec Kit artifacts enter their corresponding stage by path; other Markdown may declare `taco_scope: spec|plan|tasks` in YAML frontmatter and enter the selected stage directly. Other text values remain canonical and visibly invalid but create no custom or extension group.\n\nBoth stages and directories are derived from `files[]` and are not written to a second navigation schema.\n\n## Local Comments\n\nComments use a thread model. A `TacoCommentThread` contains a stable `id`, an `open/resolved` status, timestamps, a message array, and a text anchor:\n\n- `anchor.path`: the file path the comment belongs to; v0.3 does not allow renaming files, so this path does not change when a title is edited.\n- `anchor.position.start/end`: a fast lookup range based on the currently rendered text.\n- `anchor.quote.exact/prefix/suffix`: a Web Annotation-style quote with context; used to re-anchor after positions become invalid.\n- `messages[]`: each message contains a stable ID, local author label, optional opaque `authorId`, body, creation time, and optional `updatedAt` / `deletedAt` state.\n\nMessages are ordered by `createdAt`, then stable `id`; edits do not move them. New messages use a browser-profile principal scoped by `docId` for UI edit continuity. The principal is opaque, local, self-issued, and neither a verified account identity nor an authorization boundary outside the writable Taco capability. Editing requires an active message whose `authorId` matches the local principal. Any writable participant may delete any active message.\n\nDeletion retains the message position, author label, principal, creation time, and ID. It sets `deletedAt` and `updatedAt` to the deletion time and replaces the canonical body with `[Deleted message]`. The UI and CLI determine deletion only from `deletedAt`; an active author may use that same body text without creating a tombstone. Materialization and serialization normalize inconsistent deleted bodies to the sentinel. Root and only-message deletion never removes the surrounding thread; only the separate thread action does that.\n\nStoring both the position and the quote avoids binding comments to the volatile editor DOM. Comments are saved in the bundle and synced through the same CRDT; the collaboration role controls whether comments can be submitted, but does not promote comments into a remote business database.\n\n## Compatibility\n\n- Known version: normal browsing.\n- Newer version: read-only browsing when the current runtime can parse the transport fields; must not overwrite.\n- Corrupt JSON or an illegal path: Recovery mode.\n- HTML/HTM: preserve the original text and require a matching canonical `file:` URL for the new-page prototype preview card.\n- Unknown media type: plain-text source.\n- Legacy messages without optional state fields remain active and round-trip unchanged. Legacy or non-matching principals are not editable but remain individually deletable in writable copies.\n- Live collaboration uses sync protocol v3 for message tombstones. Peers with other protocol versions are reported and ignored before any mixed-protocol mutation is applied.\n",
      "title": "Data Model: File-first Taco Bundle"
    },
    {
      "path": "specs/001-taco-bento-product/interaction-design.md",
      "mediaType": "text/markdown",
      "content": "---\ntitle: \"Interaction Design: Taco File Browser\"\ntaco_scope: plan\n---\n\n## 1. Mental Model\n\nTaco v0.3 is a small local knowledge base containing one Spec Kit feature directory. The file sidebar is the only global panel; the outline and comments belong to the selected document and share a persistent auxiliary area beneath the workspace Header.\n\n```text\n┌──────────────────┬───────────────────────────────────────────────────────┐\n│ Taco          ‹  │ Taco title · file path                  Share Save    │\n├──────────────────┼───────────────────────────────────┬───────────────────┤\n│ files            │ editable Tiptap document         │ [Outline] Comments│\n│ folders          │                                   │ document-local    │\n│                  │ one ghost-style reading surface   │ auxiliary content │\n│ independent      │                                   │ no close control  │\n│ scroll area      │                                   │                   │\n└──────────────────┴───────────────────────────────────┴───────────────────┘\n```\n\nThere is no generated Overview page and no dashboard. Opening a Taco prefers the feature-root `README.md` as its authored overview, then falls back to `spec.md` when no README exists.\n\n## 2. Workspace Shell\n\n- Taco first splits the shell into a collapsible file sidebar and a document workspace. The workspace then splits the area beneath its 40px Header into an editable document and a persistent document-local auxiliary area.\n- The file sidebar and the workspace each have their own Header. The outline/comments area has a compact row of tabs rather than a global sidebar Header or a close button.\n- The left Header contains a precise 24×24px Taco mark and the collapse control. Once collapsed, its reopen icon moves into the workspace Header.\n- The workspace Header contains an inline-editable bundle title, followed by the root-relative path of the selected file. Editing the title immediately updates the document and browser title and marks the Taco dirty. The normalized title and the persisted `.taco.html` filename stem are an invariant: after a title change, saving requires a matching new filename rather than overwriting a differently named handle, and a copy gets a matching `-copy` title and filename. To its right are the comments shortcut, the share menu, a Castrel v2-style primary Save split button, and the globe language switcher. The split-button menu offers Save, Save a copy, and Save & unpack to folder. There is no help and no Markdown mode toggle.\n- The outline and comments reuse the shared 24px segmented control component. Selecting the Header comments shortcut activates the Comments tab; it does not open or close another global panel.\n\nThis follows Castrel's AppShell composition: the outer split first, then the workspace-local composition. Header controls use compact 24px ghost icon buttons.\n\n## 3. Stage Navigation\n\n- Route files into exactly three top-level groups: Requirements, Technical Plan, and Task Breakdown.\n- The sidebar contains only Specify, Plan, and Tasks; scoped documents appear directly in their selected stage.\n- A feature-root `README.md` enters Specify by convention and is the preferred opening document, so it needs no internal `taco_scope` metadata.\n- All `checklists/` files sit under Technical Plan, matching the official Plan → Checklist → Tasks quality-gate order.\n- Group titles use secondary text and have no leading icon slot. A centered right chevron appears only on hover or keyboard focus and rotates when expanded.\n- Physical folders such as `contracts/` and `checklists/` and custom subdirectories remain navigable. Their leading icon toggles between closed-folder and open-folder states.\n- HTML and HTM files are treated as spec prototypes and automatically routed to Specify; they do not need the Markdown-only `taco_scope` metadata.\n- The selected file is indicated by text/background, not by color alone.\n- The file icon conveys file identity without implying that a format renderer exists.\n- Mobile and narrow-screen layouts start with the drawer closed.\n- The collapse control lives in the sidebar Header; once closed, an equivalent reopen control appears in the workspace Header.\n\n## 4. Markdown Editor\n\n- Markdown opens directly in Tiptap with the official Markdown extension and stays directly editable. There is no raw/source mode.\n- The Markdown viewer has no separate filename title row. The selected root-relative path in the workspace Header provides that context.\n- The editor has no persistent formatting toolbar; editing happens directly in the document surface.\n- Each Tiptap top-level node gets a stable `data-taco-block-id`. Updates serialize both the canonical Markdown and each block's HTML; the latter is collaboration transport/cache state, not a parallel product domain model.\n- H1–H3 populate an untitled, ghost-style outline in the right auxiliary area.\n- GFM checkboxes, tables, and fenced-code structure stay readable.\n- Only fenced blocks whose language is exactly `mermaid` request the pinned-version cloud renderer and get a diagram preview plus a source/preview toggle. Bash, JSON, and other code blocks stay plain code and never load Mermaid.\n- If the Mermaid module fails to load, the preview and zoom controls disappear and the original editable code block stays visible.\n- Relative links to bundle files navigate internally.\n- External links explicitly open a new browser context.\n- Unsupported raw HTML never becomes executable editor content.\n\n```mermaid\nsequenceDiagram\n  autonumber\n  actor User as User\n  participant Editor as Tiptap editor\n  participant Markdown as Markdown extension\n  participant Bundle as In-memory TacoBundle\n  participant Outline as In-file outline\n  participant Save as Save kernel\n  participant File as .taco.html\n\n  User->>Editor: Edit heading, task, table, or code block\n  Editor->>Markdown: onUpdate / getMarkdown() + blocks\n  Markdown-->>Bundle: Update files[path].content / blocks\n  Editor-->>Outline: Re-derive H1-H3 and active item\n  User->>Save: Click save\n  Save->>Bundle: Read canonical files and comments\n  Save->>File: Safely serialize runtime + bundle blocks\n  File-->>User: Single file that reopens offline\n```\n\n## 5. Other Formats\n\nYAML, JSON, and unknown files open directly in the generic source editor. It has no separate Header, no large content padding, no border, no background surface, no tree editor, no validation badge, and no inferred schema. Editing updates the canonical `files[].content` value and the Save dirty state.\n\nJSON uses live syntax highlighting behind the native editing surface. YAML and unknown text keep plain source coloring. Long source lines scroll horizontally instead of wrapping.\n\nHTML and HTM files use a different boundary: near the top of the viewer, a centered single-line card shows only the file icon, the title, and an `Open Preview` action. CLI packaging records the canonical absolute `file:` URL, and the action opens it with `_blank` plus `noopener noreferrer` regardless of the Taco container's location; relative CSS, JavaScript, and image references therefore retain their normal filesystem base. The committed showcase shell uses only the exact `../\u003cproject-relative-path>` reference and resolves it to the same canonical `file:` URL at runtime, avoiding machine-specific build output. Missing or mismatched references are rejected before the file enters a valid Taco. Taco never substitutes a `data:` or Blob URL, embeds a prototype in an iframe, or injects it into the current document.\n\n## 6. Search\n\n`⌘/Ctrl+K` opens a dialog that searches relative paths and file text. Selecting a result closes the dialog and opens the file. v0.3 does not rank or index semantic entities.\n\nSearch has no persistent Header button; it is a keyboard tool.\n\n## 7. Local and Online Collaboration\n\n- Tabs with the same origin and `docId` can join a local room through `BroadcastChannel`; this path has no server or account dependency.\n- The Bento-aligned Share panel handles the per-tab display name, the People roster, role/key fingerprints, live status, share-copy variants, and access control.\n- Go Live connects the same CRDT session to the deployment-configured blind relay. Relay configuration stays out of the Share panel. Frames are AES-GCM encrypted; persisted writes are signed by the Owner or a delegated device key.\n- Invite to edit creates an Owner-signed delegated copy without the Owner private key. A read-only copy removes the collaboration credentials and cannot receive live updates.\n- People groups browser sessions by collaboration public key, so another tab opened from the same owner/editor copy is not presented as a separate Guest.\n- The Owner can revoke a device from the People list, or reset the room and key to invalidate every copy previously sent.\n- The display name is used for comment attribution, presence avatars, and remote cursor labels, but remains an unverified local claim, not an account identity.\n- Presence publishes the file ID, the ProseMirror selection position, and focus state. Only peers focused on the selected file render cursors/selections.\n- Document sync uses the Bento-derived CRDT. Stable file/block/comment IDs provide structural identity; block HTML merges through a token RGA, and comments are separate child nodes.\n- Heartbeats remove stale peers. A joining copy requests missing operations and can merge a persisted snapshot fork.\n\n- The workspace Header's comment icon activates the Comments tab in the right auxiliary area and shows the number of open threads for the current file.\n- Selecting rendered Markdown text shows a transient `Comment on selection` action. Submitting it creates a local thread and activates the Comments tab.\n- Open comment anchors use a non-destructive CSS highlight; the editor's document DOM and Markdown are not wrapped or rewritten.\n- Threads support replies, resolve/reopen, and deletion.\n- Clicking a quote re-anchors from the position plus the exact/prefix/suffix text context, then scrolls to the source selection.\n- Comments are part of the canonical Taco bundle and are persisted by Save/Save a copy.\n\n## 8. Responsive Behavior\n\n- `>1080px`: file tree + document + persistent document-local outline/comments area.\n- `821–1080px`: the same workspace composition, but with a narrower file sidebar.\n- `≤820px`: the file tree becomes a drawer that is closed by default; the document-local auxiliary area stays available.\n\n## 9. Header Tool Items\n\n- Language changes only the shell labels and persists locally. The built-in selection matches Bento: Simplified Chinese, English, Traditional Chinese, Japanese, Spanish, French, German, Italian, and Portuguese. The menu puts Simplified Chinese first and English second; when neither a saved selection nor a browser preference matches, Taco falls back to English.\n- Sharing saves a capability-specific Taco copy. The current browser URL is not presented as a cross-device invitation because it does not contain the document.\n- Save rewrites or downloads the self-contained Taco artifact, including in-memory Markdown edits; Save a copy never replaces the adopted file handle. When direct file writes are unavailable, every download fallback first explains that the browser controls the destination and proceeds only after confirmation; cancellation leaves the document dirty, and the completion message reports that the download started rather than claiming it finished. A denied directory grant is reported as a missing/denied folder access rather than a completed cancellation.\n- Save & unpack to folder treats a user-selected writable directory as the Taco file tree root. It writes the Taco artifact directly there, reconstructs every sidebar-visible root-relative file path there without adding the bundle's project-level `root` prefix, and adopts that Taco file as the target for subsequent Save operations. Files that already exist at those paths are updated; unrelated files are preserved.\n\n## 10. Accessibility\n\n- The file tree is a `nav` using native buttons, lists, `details`, and `summary`.\n- The main content is a real `main`, and Markdown produces semantic headings.\n- The document outline is a labeled navigation region inside the shared right auxiliary area; comments reuse the same labeled complementary region.\n- The file sidebar Header has a control with an explicit accessible name.\n- All controls have visible focus and a text label or accessible name.\n- Wide tables and source blocks scroll within their own surface.\n- Reduced motion disables smooth transitions.\n",

      "path": "specs/001-taco-bento-product/plan.md",
      "mediaType": "text/markdown",
      "content": "---\ntitle: \"Implementation Plan: Taco File Browser\"\n---\n\n## Overview\n\nBuild a self-contained browser for a single Spec Kit feature directory. At build time Vite reads the real directory and injects a generic file bundle. The runtime derives stage projections, edits Markdown as stable Tiptap blocks, and syncs replicas through a Bento-derived CRDT using a local `BroadcastChannel` plus an optional encrypted WebSocket relay.\n\n## Technical Context\n\n- **Language**: TypeScript 5.8\n- **Runtime**: browser; optional Cloudflare Worker blind relay for cross-device collaboration\n- **Build**: Vite + `vite-plugin-singlefile`\n- **Markdown**: Tiptap 3 + the official Markdown extension; canonical output uses `getMarkdown()`\n- **Diagrams**: Mermaid 12.0.0, loaded on demand from a pinned CDN ESM address for the current document in strict security mode; falls back to source when offline\n- **Sanitization**: DOMPurify\n- **Testing**: Vitest + jsdom\n- **Storage**: an embedded UTF-8 file bundle; canonical Markdown plus collaboration block/cache state\n- **Collaboration**: `BroadcastChannel` locally; AES-GCM WebSocket transport, signed writes, encrypted replay snapshots, and revocation over an optional relay\n- **Targets**: modern desktop browsers; responsive reading on narrow screens\n- **Constraints**: zero network requests before Mermaid rendering or online collaboration is explicitly requested; no business schema beyond files\n- **Spec Kit integration**: a schema v1 extension with a mandatory `after_specify` hook; a standalone Node.js CLI for pack/sync/comment inspection\n\n## Constitution Check\n\n- File content remains the single source of truth: pass.\n- Unknown formats fall back to source: pass.\n- No account dependency: pass; Mermaid and the self-hosted encrypted relay are optional network enhancements. Display names remain unverified local claims.\n- Unsafe Markdown cannot execute: covered by sanitizer tests.\n- The current UI offers Markdown WYSIWYG editing plus generic YAML/JSON/text source editing without implying structured-format editing or cloud persistence: requires a browser audit.\n\n## Runtime Architecture\n\n```mermaid\nflowchart TB\n  HTML[\"Single-file .taco.html\"] --> Parser[\"Bundle parser + path validation\"]\n  Parser --> Files[\"Canonical TacoBundle files[]\"]\n  Files --> Stage[\"Stage and directory projection\"]\n  Files --> Editor[\"Tiptap + Markdown extension\"]\n  Files --> Search[\"Filename and full-text search\"]\n  Files --> Comments[\"Local comment anchors\"]\n  Files --> Store[\"TacoStore sync projection\"]\n  Store --> CRDT[\"Bento-derived CRDT\"]\n  CRDT \u003c--> Channel[\"BroadcastChannel / docId\"]\n  Channel \u003c--> Peer[\"Same-origin browser tabs\"]\n  CRDT \u003c--> E2EE[\"AES-GCM + signed frames\"]\n  E2EE \u003c--> Relay[\"Blind relay / encrypted replay\"]\n  Relay \u003c--> Remote[\"Cross-device Taco replicas\"]\n  Peer --> Presence[\"Members / cursors / selections\"]\n  Editor --> Mermaid[\"Mermaid Node View\"]\n  Mermaid -. \"only when the current document has Mermaid\" .-> CDN[\"Pinned-version Mermaid ESM\"]\n  Mermaid --> Fallback[\"Offline / load failure: source\"]\n  Editor --> Outline[\"In-file H1-H3 outline\"]\n  Editor -->|\"blocks + getMarkdown()\"| Files\n  Stage --> Shell[\"FileBrowser workspace\"]\n  Search --> Shell\n  Comments --> Shell\n  Outline --> Shell\n  Files --> Save[\"Bento-derived save kernel\"]\n  Save --> HTML\n  Feature[\"Spec Kit feature directory\"] --> CLI[\"Taco CLI: pack / sync / comments\"]\n  CLI --> HTML\n  HTML --> Review[\"Human edits + anchored comments\"]\n  Review --> CLI\n  CLI --> Feature\n```\n\nEvery UI branch ultimately returns to the same `files[]`. Mermaid never enters the single-file runtime; only the Mermaid Node View of the currently visible document requests the pinned-version cloud ESM. Mermaid SVG, the Tiptap document tree, outline active state, and search results exist only at runtime.\n\n## Project Structure\n\n```text\nsrc/\n├── file-browser.ts   # file tree and navigation\n├── main.ts           # bundle boot and read-only Agent API\n├── model.ts          # transport validation only\n├── identity.ts       # per-tab collaboration/comment identity\n├── store.ts          # bundle ↔ CRDT projection\n├── stage-navigation.ts # derived Specify/Plan/Tasks projection\n├── render.ts         # Markdown renderer and heading slugs\n├── tiptap-editor.ts  # shared Tiptap extension composition\n├── tiptap-code-block.ts # code-block Node View and Mermaid-only preview\n├── mermaid.ts        # pinned cloud loader, strict renderer and source fallback\n├── styles.css\n├── sync/             # Taco CRDT binding, local session and encrypted online transport\n└── kernel/           # Bento-derived persistence and generic CRDT engine\n\nserver/sync-worker/   # optional Cloudflare Worker relay; ciphertext only\n\ntests/\n├── model.test.ts\n├── render.test.ts\n├── tiptap-editor.test.ts\n├── collaboration.test.ts\n├── file-browser.test.ts\n└── taco-cli.test.ts\n\nextensions/taco/\n├── extension.yml    # Spec Kit command and after_specify hook registration\n├── commands/        # Agent procedures for create and review\n├── bin/taco.mjs     # offline pack, conflict-safe sync and comment inspection\n└── assets/          # self-contained Taco runtime shell\n```\n\n## Build Flow\n\n1. `vite.config.ts` recursively reads `specs/001-taco-bento-product/`.\n2. Each file becomes `{ path, mediaType, content }`, with no semantic parsing.\n3. The bundle is injected into `#taco-document`.\n4. `vite-plugin-singlefile` inlines the runtime and CSS.\n5. The browser parser validates path boundaries before rendering.\n6. Stage navigation recognizes core and conventional Spec Kit paths, routes HTML/HTM prototype paths to Specify, then reads the YAML `taco_scope` open enum from other Markdown documents; physical subdirectories stay nested inside one of the three default stages.\n7. CLI packaging records each HTML file's canonical absolute `file:` URL after verifying that it matches the validated project-relative path. The committed showcase build instead records the exact `../\u003cproject-relative-path>` reference so CI and local checkout builds are identical, then resolves it only from a local `file:` Taco. Selecting a valid file opens its resolved URL directly; missing or mismatched references fail validation and never fall back to embedded HTML execution.\n\n## Spec Kit Review Round-Trip\n\n1. The extension's mandatory `after_specify` hook dispatches `speckit.taco.create` after `spec.md` is written.\n2. The CLI recursively reads UTF-8 feature files, saves each file's exact content plus a `sourceHash`, and injects the bundle into the packaged Taco shell.\n3. Direct human edits change `files[].content`; comments live in the same bundle as separate anchored threads. Saving the Taco is an explicit handoff boundary.\n4. `speckit.taco.review` first runs `sync --dry-run --json`. It checks every target path and hash before any write.\n5. If a canonical hash differs from both the `sourceHash` and the Taco content hash, the entire sync refuses to write. Otherwise direct edits are written back to their original paths.\n6. The Agent reads each open comment from the JSON result, applies actionable feedback to canonical files, then repacks the same Taco with `--from` so threads are preserved and file baselines advance.\n\n## Collaboration Boundary\n\nMarkdown editing and persistence continue to operate on the virtual file map. A session fans the same set of CRDT frames out to both the local and online transports. Files carry a symmetric read capability, plus an Owner key, an Owner-signed invitation, or no signing key for viewers. The relay enforces signed writes and revocation while staying blind to document content. Account identity, SSO, and organization policy remain separate deployment concerns.\n",
      "title": "Implementation Plan: Taco File Browser"

      "content": "---\ntitle: \"Quickstart: Taco File Browser\"\n---\n\n## Build\n\n```bash\nnpm install\nnpm test\nnpm run build\n```\n\nOpen `dist-single/Taco_Spec.taco.html` directly from the file system.\n\n## Scenario A — Stage Projection and Directory Fidelity\n\n1. Count the number of files under `specs/001-taco-bento-product/`.\n2. Compare it with `window.taco.listFiles()`.\n3. Confirm the sidebar exposes only Specify, Plan, and Tasks, with each stage's core file first.\n4. Open `contracts/` and other physical subdirectories in the left navigation.\n5. In a temporary copy, change a document's YAML `taco_scope` between `spec`, `plan`, `tasks`, and an invalid text value; verify routing and validation update without losing the invalid text.\n\nExpected: the file count and relative paths match exactly; real directories stay nested; the modified document moves directly to the selected stage without creating an extension group. A missing or invalid scope value does not create a fourth group.\n\n## Scenario B — Markdown Reading\n\n1. Open `README.md` and confirm it appears under Specify; if the feature has no README, confirm Taco opens `spec.md` instead.\n2. Use `On this page` to jump to Requirements.\n3. Switch between WYSIWYG and Markdown, and edit in both modes.\n\nExpected: heading navigation is correct, and the source is raw Markdown.\n\n## Scenario C — Editable YAML/JSON Source\n\nAdd a temporary YAML or JSON file to the source feature directory and rebuild.\n\nExpected: the file appears in the tree, in an undecorated source editor with no separate header, no large padding, no border, and no background. Editing updates the unsaved state and the saved canonical content; JSON has live syntax highlighting. No structured form appears.\n\n## Scenario D — Search\n\n1. Press `⌘/Ctrl+K`.\n2. Search for a filename.\n3. Search for a phrase that appears only in file content.\n\nExpected: both queries locate the correct file.\n\n## Scenario E — Offline Single File\n\n1. Open the generated file with `file://`.\n2. Disable network access and reload.\n3. Browse several Markdown files.\n\nExpected: content stays available, and the resource-request list is empty.\n\n## Scenario F — Narrow Viewport\n\nReload the file at 720px width.\n\nExpected: the file drawer starts closed, can be opened from the top bar, and the page has no horizontal overflow.\n\n## Scenario G — Security\n\nRun the Markdown sanitizer test fixtures that contain `\u003cscript>` and event attributes.\n\nExpected: no executable element or event attribute reaches the rendered DOM.\n",

      "path": "specs/001-taco-bento-product/README.md",
      "mediaType": "text/markdown",
      "content": "\u003cdiv align=\"center\">\n  \u003cimg src=\"https://raw.githubusercontent.com/Arcadia822/taco/main/src/assets/taco-logo.svg\" alt=\"Taco logo\" width=\"96\">\n  \u003ch1>Taco\u003c/h1>\n  \u003cp>\u003cstrong>English\u003c/strong> · \u003ca href=\"README.zh-CN.md\">简体中文\u003c/a>\u003c/p>\n  \u003cp>\n    \u003ca href=\"https://github.com/Arcadia822/taco/actions/workflows/ci.yml\">\u003cimg src=\"https://github.com/Arcadia822/taco/actions/workflows/ci.yml/badge.svg\" alt=\"CI\">\u003c/a>\n  \u003c/p>\n  \u003cp>\n    \u003ca href=\"https://taco-spec-en.arcadia822.chatgpt.site\">Live demo (English)\u003c/a> ·\n    \u003ca href=\"https://taco-spec-zh-cn.arcadia822.chatgpt.site\">在线演示（简体中文）\u003c/a>\n  \u003c/p>\n  \u003cp>\u003cstrong>Review, hand off, and manage specs with humans and agents — in one file.\u003c/strong>\u003c/p>\n\u003c/div>\n\nTaco turns a specification directory into a portable review workspace. A human can open one `.taco.html` file in a browser, read the complete spec, edit the original Markdown, and leave anchored comments. An agent can then import those edits and comments back into the canonical files, handle the feedback, and produce the next review copy.\n\nThe file is the handoff. It carries the spec, its directory structure, the reader, the editor, comments, and optional collaboration state. The recipient needs a browser—not a Taco account, hosted workspace, or proprietary requirements database.\n\nTaco is built with gratitude to [Bento](https://github.com/nyblnet/bento), the office suite that fits in a file. Bento showed that a complete creative workspace could travel as one portable document; Taco carries that idea into specification review.\n\n![Taco specification browsing and review interface](https://raw.githubusercontent.com/Arcadia822/taco/main/docs/assets/taco-overview.png)\n\nTaco includes lightweight support for Spec Kit's directory conventions and is designed for specification-driven development (SDD). It does not require one methodology: its underlying model remains a Markdown file browser and review surface that supports design documents and other directory structures. An Agent can organize Markdown and directories around a team's process, then package that structure as a Taco.\n\n```text\ncanonical spec directory → one .taco.html → human review → agent sync → canonical spec directory\n```\n\n- **Review together:** Humans get a readable interface for editing and anchored comments; agents get structured files and complete review threads.\n- **Hand off without setup:** Send one HTML file that opens locally in a modern browser and keeps working offline.\n- **Manage the real spec:** Markdown files remain canonical, diffable, and usable by existing repositories, agents, and command-line tools.\n\n## Quickstart: add Taco to a Spec Kit repo\n\nIn a repository that already uses Spec Kit, give its Agent this instruction:\n\n```text\nInstall Taco in this Spec Kit repository and make Taco the default review flow\nfor future specs. Follow the installation instructions in the Taco repository:\nhttps://github.com/Arcadia822/taco\n```\n\nThe Agent reads Taco's repository instructions, installs the Spec Kit extension into the current repository, and runs `prepare-policy` to install Taco's persistent workflow in the declared 5xP Process document, or `docs/taco-process.md` for projects without 5xP. The existing project `AGENTS.md` receives one mandatory reference to that document. That plugin installation is Taco: it includes the Agent commands, mandatory lifecycle hooks, offline CLI, self-contained browser shell, and the project rule that keeps Taco current. No second Taco install is required.\n\nAfter installation, the SDD flow is:\n\n```mermaid\nflowchart LR\n    A[\"speckit.specify\"] --> B[\"Spec Kit feature directory\u003cbr/>canonical source\"]\n    B --> C[\"Taco plugin updates\u003cbr/>&lt;feature&gt;/&lt;feature&gt;.taco.html\"]\n    C --> D[\"Agent presents Taco\u003cbr/>as a clickable local file\"]\n    D --> E[\"Human reviews\u003cbr/>edits, and comments\"]\n    E --> F[\"Save .taco.html\"]\n    F --> G[\"Agent runs\u003cbr/>speckit.taco.review\"]\n    G --> H{\"Conflicts?\"}\n    H -- \"Yes\" --> I[\"Stop and ask the user\"]\n    H -- \"No\" --> J[\"Import edits\u003cbr/>handle comments\"]\n    J --> K[\"Refresh and show\u003cbr/>the same Taco\"]\n    K --> E\n```\n\nThe project-local `AGENTS.md` routes subsequent Spec Kit and Taco work to the process document. Existing instructions are preserved; rerunning preparation is a no-op. Ambiguous routing or customized Taco policy requires a deliberate merge.\n\n## Why open source\n\nSpecifications should not be locked inside an account, a server-side workspace, or a proprietary data model. The project follows these boundaries:\n\n- Files are the canonical source.\n- A Taco can be opened offline, copied, archived, and shared.\n- Markdown remains readable and diffable, and existing agents and command-line tools can continue to process it.\n- Both the interface and the transport format can be inspected, modified, and rebuilt.\n- Files Taco does not understand remain intact instead of being silently discarded.\n\nThe project is licensed under the MIT License. You can study the implementation, change the interaction model, embed your own specification directory, or adapt the single-file container for other local document workflows.\n\n## Current capabilities\n\n- Package a complete specification directory into one portable `.taco.html` file that opens in a browser and works offline.\n- Browse, search, and edit the canonical Markdown and text files while preserving their real directory structure.\n- Review specs with anchored comment threads, including in-place editing of your own messages and tombstone deletion of individual messages without removing their replies; then save an updated Taco or write the changes back to the original directory.\n- Collaborate in real time on the same machine or across devices with encrypted sharing, editor and reader copies, and access controls.\n- Integrate with Spec Kit to keep each feature's Taco current and safely import human edits and comments with conflict detection.\n\n## Agent installation\n\nThe Quickstart above is the user-facing entry point. [`docs/agent-installation.md`](docs/agent-installation.md) is the machine-facing installation and review guide for the Agent acting on the user's behalf. Contributor instructions for Agents working in this repository remain in [`AGENTS.md`](AGENTS.md).\n\nAgent requirements:\n\n- Keep the feature directory canonical. Create and refresh Taco files through the CLI instead of hand-editing the HTML shell.\n- Preview every import with `sync --dry-run --json`. Stop on conflicts; `--force` requires explicit authorization for the exact paths.\n- Read every open comment and its full message history, then refresh the same Taco so the next reviewer receives the updated spec.\n- Treat a live collaboration-enabled Taco as potentially credential-bearing. Do not upload or paste its contents into another service without the user's approval.\n\n## Spec Kit plugin\n\nThe plugin lives in `extensions/taco/` and is implemented as a local Spec Kit extension. The Agent installs and verifies it during Quickstart; the user does not need to manage extension commands manually.\n\nInstalling the extension installs Taco's complete project-local runtime. Required lifecycle hooks run `speckit.taco.update` after Spec Kit operations that create or modify feature artifacts. The command packages the complete feature directory as `\u003cfeature>/\u003cfeature>.taco.html`; every refresh targets that same file and preserves its comments. After a human edits or comments in Taco and saves the file, ask the Agent to use:\n\n```text\nspeckit.taco.review specs/001-example/001-example.taco.html\n```\n\n`review` performs a read-only preflight before writing Taco edits back to their original paths. It then hands open comments to the agent with their anchored text, position, and complete message history. Every file includes the SHA-256 baseline captured when it was packaged. If both the source file and the Taco copy changed, the entire sync refuses to write instead of silently choosing one side. Agent-facing installation and CLI details live in [`extensions/taco/README.md`](extensions/taco/README.md).\n\nThe packer includes every visible UTF-8 regular file. Its only default exclusions are `*.taco.html` and hidden paths; repeatable `--ignore` parameters add explicit feature-relative path or glob exclusions. Visible unsupported content fails packaging instead of disappearing silently.\n\nAfter each successful update, the Agent presents the exact generated Taco as a native clickable local file. In Codex, the user click opens it in Browser; the Agent does not attempt autonomous `file://` navigation. Other Agent GUIs may additionally open and verify the file only when they explicitly support local HTML navigation.\n\n## Project structure\n\n```text\nsrc/                                  Browser, editor, comments, save, and collaboration runtime\nextensions/taco/                      Spec Kit manifest, agent commands, offline CLI, and Taco shell\ntests/                                Data model, rendering, interaction, collaboration, and CLI round-trip tests\nspecs/001-taco-bento-product/         Default Taco content and product specification\nspecs/002-taco-speckit-plugin/        Installable Spec Kit plugin specification and acceptance flow\nserver/sync-worker/                    Optional end-to-end encrypted collaboration relay\ndocs/agent-installation.md            Agent installation and review workflow\nAGENTS.md                             Instructions for Agents contributing in this repository\nCONTRIBUTING.md                       Contributor development and validation guide\nvite.config.ts                        Default bundle injection and build configuration\n```\n\nThe default specification directory is also the project's executable example. Its `README.md` mirrors this project README and opens first as the overview. Product behavior is in `spec.md`, technical design is in `plan.md`, task state is in `tasks.md`, and the container protocol is in `contracts/taco-document.md`.\n\n## Document routing\n\nA feature-root `README.md` routes to Specify and opens by default; `spec.md` is the fallback when no README exists. `spec.md`, `plan.md`, and `tasks.md` remain the three core stage files. Known Spec Kit files and directories follow Taco's built-in conventions. Every other Markdown document may use the YAML `taco_scope` property for explicit routing:\n\n```md\n---\ntitle: 'Interaction design'\ntaco_scope: plan\n---\n```\n\nThe property accepts text, but only `spec`, `plan`, and `tasks` route a file. Taco presents all leading YAML frontmatter as an Obsidian-style property editor while preserving it in canonical Markdown. New specs store their title in YAML and begin the body at H2 instead of repeating the title as H1. See `AGENTS.md` for the complete convention.\n\n## Design principles\n\n1. **Files first:** File content is the only source of truth.\n2. **Portable by default:** Core reading, editing, and saving must work offline.\n3. **Derived UI:** Stages, directories, the outline, and the search index must not become a second persistent state.\n4. **Graceful degradation:** Unknown formats show their source without guessed business semantics.\n5. **No invisible rewrite:** Rendered output must never reformat or replace canonical Markdown.\n6. **Honest scope:** Same-machine collaboration requires no service. Cross-device collaboration requires an explicitly configured relay. Roles are enforced by file-held cryptographic capabilities; self-declared display names are not presented as account identities.\n\n## Contributing\n\nIssues and pull requests are welcome. See [`CONTRIBUTING.md`](CONTRIBUTING.md) for the complete development workflow, test expectations, and generated-artifact policy. Before submitting a change, run at least:\n\n```bash\nnpm run check\n```\n\nUseful contribution areas include accessibility, editing, more offline text renderers, cross-browser verification, performance, import and export, relay operations, and protocol audits. Enterprise accounts and SSO identities remain a separate boundary; a self-declared display name must not be presented as verified identity.\n\n## Project status\n\nTaco is currently a v0.3 prototype. File browsing, Markdown editing, YAML frontmatter properties, generic source editing, JSON syntax highlighting, Mermaid, comments, single-file saving, same-origin collaboration, and optional cross-device encrypted relay collaboration are implemented. Standalone structured YAML/JSON editing, version history, accounts, and SSO are not.\n\nTaco v0.3 is a testable prototype, not a production-stability commitment.\n\n## License and attribution\n\nThe specification-directory and artifact conventions were inspired by [GitHub Spec Kit](https://github.com/github/spec-kit).\n\nTaco is licensed under the MIT License. See [`LICENSE`](LICENSE) for the complete text and [`THIRD_PARTY_NOTICES.md`](THIRD_PARTY_NOTICES.md) for third-party attribution.\n",
      "title": "Taco"
    },

      "mediaType": "text/markdown",
      "content": "---\ntitle: \"Research: Taco File Browser\"\n---\n\n## Decision 1 — Files Are Canonical\n\n**Decision**: Taco stores the feature directory as files and keeps Markdown as Markdown, unchanged.\n\n**Evidence**: The core templates and workflows of GitHub Spec Kit treat `spec.md`, `plan.md`, and `tasks.md` as primary artifacts. The plan stage additionally creates `research.md`, `data-model.md`, `quickstart.md`, and `contracts/`; checklist output is still Markdown.\n\n**Rejected**: Normalizing stories, requirements, tasks, and evidence into a Taco-specific JSON schema.\n\n**Reason**: That model would lose arbitrary Markdown structure, custom presets, and unknown sections, while forcing both humans and Agents to learn a second protocol.\n\n## Decision 2 — JSON Only as the Single-File Envelope\n\n**Decision**: `.taco.html` uses a small JSON envelope containing the path, media type, and raw text.\n\n**Reason**: The browser runtime needs an unambiguous, safe container format. The envelope must not interpret file semantics.\n\n## Decision 3 — Markdown First, Generic Source Editing for Other Formats\n\n**Decision**: v0.3 renders Markdown as WYSIWYG. YAML, JSON, and unknown text keep exact source in a generic editor; JSON gets syntax highlighting, but no format is projected into a structured form.\n\n**Reason**: Markdown covers the primary Spec Kit artifacts. Exact source editing preserves file fidelity, while a premature YAML/OpenAPI form would just repeat the same over-modeling mistake at a smaller scale.\n\n## Decision 4 — Derived Navigation\n\n**Decision**: Stage navigation, the in-group directory tree, headings, and the search index are derived at load time.\n\n**Reason**: Persisting them creates drift. They are cheap to recompute and carry no authorial intent.\n\nThe stage projection uses `spec.md`, `plan.md`, and `tasks.md` as core anchors. A feature-root `README.md` routes to Specify by convention and becomes the preferred opening document, with `spec.md` as the fallback. Known Spec Kit paths route by convention, and the entire `checklists/` directory sits under Plan because the official workflow runs Checklist after Plan and before Tasks. Other Markdown selects one of these stages through YAML `taco_scope`. Only `spec`, `plan`, and `tasks` route; other text remains visible and invalid. There is no Custom or Extensions group.\n\n## Decision 5 — Keep Bento at the Container Layer\n\n**Decision**: Keep the self-contained Vite build pattern and use the persistence kernel for the current Markdown editing and artifact saving.\n\n**Reason**: The useful inheritance from Bento is file portability, not the document model of any particular Bento app.\n\n## Decision 6 — Use a Spec Kit Extension Hook, Not a Preset or Standalone Workflow\n\n**Decision**: Taco ships as a schema v1 Spec Kit extension. It adds two namespaced commands and registers a mandatory `after_specify` hook for artifact creation. The reverse round-trip stays an explicit review command, because importing human edits is a state-changing operation that must surface conflicts before writing.\n\n**Evidence**: Spec Kit defines extensions as the mechanism for new commands, external integrations, and lifecycle hooks. A preset would override how existing templates behave, which would wrongly couple the Taco transport to the content of `spec.md`. A workflow could add approval gates, but requiring teams to replace their normal Spec Kit command sequence just to obtain a review artifact would widen the integration boundary. The official hook list includes `after_specify`; command files are rendered into the currently active Agent integration at install time.\n\n**Rejected**:\n\n- A preset that appends Taco instructions to the core spec template.\n- A shell hook that silently writes back to canonical files without Agent inspection.\n- A browser-only \"Save & unpack\" as the Agent protocol; it cannot provide deterministic, machine-readable comments or repository conflict detection.\n\n**Compatibility boundary**: The manifest requires Spec Kit `>=0.16.0,\u003c1.0.0`, consistent with the extension and hook behavior researched on 2026-08-10. The CLI itself uses only Node.js built-in modules and remains usable without Spec Kit.\n\n## Sources\n\n- [GitHub Spec Kit](https://github.com/github/spec-kit)\n- [Spec template](https://github.com/github/spec-kit/blob/main/templates/spec-template.md)\n- [Plan template](https://github.com/github/spec-kit/blob/main/templates/plan-template.md)\n- [Tasks template](https://github.com/github/spec-kit/blob/main/templates/tasks-template.md)\n- [Bento](https://github.com/nyblnet/bento)\n- [Spec Kit extension reference](https://github.github.io/spec-kit/reference/extensions.html)\n- [Spec Kit extension development guide](https://github.com/github/spec-kit/blob/main/extensions/EXTENSION-DEVELOPMENT-GUIDE.md)\n- [Spec Kit extension publishing guide](https://github.com/github/spec-kit/blob/main/extensions/EXTENSION-PUBLISHING-GUIDE.md)\n",
      "title": "Research: Spec Kit Artifact Boundary and Bento Mapping"
    },
