# Tacobin is deployed to Vercel only from a `tacobin-v*` tag.
#
# `packages/host/vercel.json` sets `git.deploymentEnabled: false`, so Vercel creates no
# deployment for branch pushes, pull requests, or tag pushes. Vercel's Git integration has no
# tag trigger at all, so the tag drives a Deploy Hook instead: this job runs on the tag and
# asks Vercel to build the production branch, which reuses the project's own Root Directory
# and Install Command.
#
# Requires the repository secret TACOBIN_DEPLOY_HOOK: the Deploy Hook URL from
# Vercel > tacobin > Settings > Git > Deploy Hooks, created against the `main` branch.
# Treat that URL as a credential; rotate it in the dashboard if it leaks.
#
# The served tag alone proves only that the build finished. The Host also needs its runtime
# configuration on Vercel — DATABASE_URL (Postgres) and TACO_CSRF_SECRET — or publish and
# review fail while /deploy.json still answers (tacobin-v0.6.0 shipped without both). The last
# step therefore publishes a small Taco and reads its shared state, as a reviewer's page does.

name: Deploy Tacobin

on:
  push:
    tags:
      - 'tacobin-v*'

permissions:
  contents: read

concurrency:
  group: deploy-tacobin
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the release tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main." \
              "The Deploy Hook builds main, so this would publish a different commit." \
              "Merge the tagged commit into main and re-tag."
            exit 1
          fi
          echo "Tagged commit $GITHUB_SHA is on main; the hook will build it." >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger the production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.TACOBIN_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Repository secret TACOBIN_DEPLOY_HOOK is not set." \
              "Create a Deploy Hook for the main branch in Vercel > tacobin > Settings >" \
              "Git > Deploy Hooks, then store its URL as that secret."
            exit 1
          fi

          response="$(curl --silent --show-error --fail-with-body --request POST "$DEPLOY_HOOK")"
          echo "Deploy hook response: $response"
          job_id="$(printf '%s' "$response" | jq -r '.job.id // empty')"
          if [ -z "$job_id" ]; then
            echo "::error::The Deploy Hook returned no job id: $response"
            exit 1
          fi

          echo "Triggered Vercel build $job_id for $GITHUB_REF_NAME ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          echo "Watch it at https://vercel.com/castrel-ai/tacobin/deployments" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the production deployment
        env:
          PRODUCTION_URL: https://taco.arcadia-han.com
        run: |
          echo "Polling $PRODUCTION_URL/deploy.json for tag $GITHUB_REF_NAME ..."
          deadline=$((SECONDS + 900))
          while :; do
            body="$(curl --silent --show-error --max-time 20 "$PRODUCTION_URL/deploy.json" 2>/dev/null || true)"
            served="$(printf '%s' "$body" | jq -r '.tag // empty' 2>/dev/null || true)"
            if [ "$served" = "$GITHUB_REF_NAME" ]; then
              echo "Production serves $served; Vercel build successfully completed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Production still reports '${served:-nothing}' instead of $GITHUB_REF_NAME after 15 minutes. Check https://vercel.com/castrel-ai/tacobin/deployments"
              exit 1
            fi
            sleep 20
          done

      - name: Smoke-test publish and review against production
        env:
          PRODUCTION_URL: https://taco.arcadia-han.com
        run: |
          # Publish what `taco-cli publish` sends: a taco/files snapshot in the taco-host/1 envelope.
          bundle="$(jq -n --arg tag "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" '{
            protocol: "taco-host/1",
            snapshot: {
              format: "taco/files", version: 1,
              docId: "deploy-smoke-\($tag)",
              title: "Deploy smoke \($tag)",
              root: "smoke",
              files: [{ path: "smoke/README.md", mediaType: "text/markdown",
                        content: "# Deploy smoke\n\nPublished by the Deploy Tacobin workflow for \($tag) (\($sha)) to check that publishing and review work in production.\n" }]
            }
          }')"

          publish="$(curl --silent --show-error --max-time 30 --write-out '\n%{http_code}' \
            --header 'Content-Type: application/json' --data "$bundle" "$PRODUCTION_URL/v1/tacos")"
          publish_status="${publish##*$'\n'}"
          publish_body="${publish%$'\n'*}"
          taco_id="$(printf '%s' "$publish_body" | jq -r '.tacoId // .id // empty' 2>/dev/null || true)"
          if [ "$publish_status" != "201" ] && [ "$publish_status" != "200" ] || [ -z "$taco_id" ]; then
            echo "::error::Publishing to $PRODUCTION_URL failed (HTTP $publish_status): $publish_body." \
              "A 503 naming DATABASE_URL means the Vercel project has no Postgres connection."
            exit 1
          fi

          # Reading the shared state queries Postgres and signs a CSRF token, as the review page does.
          state="$(curl --silent --show-error --max-time 30 --write-out '\n%{http_code}' \
            "$PRODUCTION_URL/v1/tacos/$taco_id/state")"
          state_status="${state##*$'\n'}"
          state_body="${state%$'\n'*}"
          if [ "$state_status" != "200" ]; then
            echo "::error::Reading review state for $taco_id failed (HTTP $state_status): $state_body." \
              "A 500 naming TACO_CSRF_SECRET means that Vercel environment variable is missing."
            exit 1
          fi

          echo "Published smoke Taco $PRODUCTION_URL/t/$taco_id and read its review state." >> "$GITHUB_STEP_SUMMARY"
