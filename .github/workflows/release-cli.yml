name: Release taco-cli

on:
  push:
    tags:
      - 'taco-cli-v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#taco-cli-v}"
          PACKAGE_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"

      - name: Compile standalone binaries
        shell: bash
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun build --compile --minify --target="bun-$target" \
              packages/cli/src/main.ts --outfile "release/taco-cli-$target"
            chmod 0755 "release/taco-cli-$target"
            tar -C release -czf "release/taco-cli-$target.tar.gz" "taco-cli-$target"
          done
          rm release/taco-cli-darwin-arm64 release/taco-cli-darwin-x64 \
            release/taco-cli-linux-arm64 release/taco-cli-linux-x64
          cd release
          sha256sum taco-cli-*.tar.gz > SHA256SUMS

      - name: Smoke-test Linux x64 binary
        shell: bash
        run: |
          tar -C release -xzf release/taco-cli-linux-x64.tar.gz
          release/taco-cli-linux-x64 help > /tmp/taco-cli-help.json
          release/taco-cli-linux-x64 skills read taco > /tmp/taco-cli-skill.json
          node -e "const h=require('/tmp/taco-cli-help.json'); if(h.schema!=='taco-cli-help/1') process.exit(1)"
          node -e "const s=require('/tmp/taco-cli-skill.json'); if(!s.content.includes('## Start Here')) process.exit(1)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/taco-cli-*.tar.gz
            release/SHA256SUMS

      - name: Set up Node.js for npm release
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Publish to npm via OIDC trusted publishing
        shell: bash
        run: |
          npm --workspace=@tacobin/cli publish --provenance
