name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A main push keeps its verdict. cancel-in-progress true would kill an earlier
# main push's run when two land close together (four such runs, 10-02 to
# 10-09), leaving that commit with no pass/fail record. Branch and PR runs
# still cancel. A third push in one burst still drops a queued run (TACO-63).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, tests, and build
        run: npm run check

      - name: Install Chromium for the built-shell smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the built single-file shell
        run: npm run test:browser

      - name: Verify major browser workflows without agents
        run: npm run test:verify -- --out artifacts/verify-taco/ci-suite

      - name: Set up Bun for the CLI build
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build the standalone CLI
        run: npm run build --workspace @tacobin/cli

      - name: Verify CLI packaging, extraction, and reviewed-file conflicts
        run: node .agents/skills/verify-taco/scripts/verify.mjs --scenario .agents/skills/verify-taco/scripts/cli.mjs --out artifacts/verify-taco/ci-cli

      - name: Smoke-test the CLI toolbox and two-round listener handoff
        env:
          TACO_SMOKE_OUT: artifacts/smoke-toolbox
        run: npm run test:toolbox

      - name: Upload browser and CLI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-toolbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verify-taco/
            artifacts/smoke-toolbox/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify committed build artifacts
        shell: bash
        run: |
          artifacts=(
            extensions/taco/assets/taco-shell.html
            extensions/taco/templates
            skills/taco
          )
          stale="$(git status --porcelain --untracked-files=all -- "${artifacts[@]}")"
          if [ -n "$stale" ]; then
            echo "Generated artifacts are stale — run 'npm run build' and commit the regenerated files:"
            echo "$stale"
            exit 1
          fi

  host-smoke:
    name: Tacobin local Host verification without agents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Bun for the real remote CLI
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build the standalone CLI and current shells
        run: npm run build --workspace @tacobin/cli

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real Host routes and browser persistence
        run: npm run test:host -- --out artifacts/smoke-host/ci

      - name: Upload Host verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/smoke-host/
          if-no-files-found: warn
          retention-days: 14

  spec-kit-extension:
    name: Spec Kit ${{ matrix.spec-kit-version }} extension install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec-kit-version: 0.16.5
            spec-kit-ref: v0.16.5
          - spec-kit-version: 1.0.1
            spec-kit-ref: v1.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Spec Kit
        env:
          SPEC_KIT_REF: ${{ matrix.spec-kit-ref }}
        run: uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}"

      - name: Initialize a Codex Spec Kit project
        run: |
          mkdir "$RUNNER_TEMP/spec-kit-project"
          cd "$RUNNER_TEMP/spec-kit-project"
          specify init --here --force --non-interactive --ignore-agent-tools \
            --integration codex --integration-options="--skills"

      - name: Install and verify Taco
        run: |
          cd "$RUNNER_TEMP/spec-kit-project"
          specify extension add --dev "$GITHUB_WORKSPACE/extensions/taco"
          specify extension list
          test -f .agents/skills/speckit-taco-update/SKILL.md
          test -f .agents/skills/speckit-taco-review/SKILL.md
          for hook in specify clarify plan checklist tasks analyze implement converge; do
            grep -q "after_${hook}:" .specify/extensions.yml
          done
