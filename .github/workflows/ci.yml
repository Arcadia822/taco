name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A main push keeps its verdict. cancel-in-progress true would kill an earlier
# main push's run when two land close together (four such runs, 10-02 to
# 10-09), leaving that commit with no pass/fail record. Branch and PR runs
# still cancel. A third push in one burst still drops a queued run (TACO-63).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, tests, and build
        run: npm run check

      - name: Install Chromium for the built-shell smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the built single-file shell
        run: npm run test:browser

      - name: Verify committed build artifacts
        shell: bash
        run: |
          artifacts=(
            extensions/taco/assets/taco-shell.html
            extensions/taco/templates
            skills/taco
          )
          stale="$(git status --porcelain --untracked-files=all -- "${artifacts[@]}")"
          if [ -n "$stale" ]; then
            echo "Generated artifacts are stale — run 'npm run build' and commit the regenerated files:"
            echo "$stale"
            exit 1
          fi

  spec-kit-extension:
    name: Spec Kit ${{ matrix.spec-kit-version }} extension install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec-kit-version: 0.16.5
            spec-kit-ref: v0.16.5
          - spec-kit-version: 1.0.1
            spec-kit-ref: v1.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Spec Kit
        env:
          SPEC_KIT_REF: ${{ matrix.spec-kit-ref }}
        run: uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}"

      - name: Initialize a Codex Spec Kit project
        run: |
          mkdir "$RUNNER_TEMP/spec-kit-project"
          cd "$RUNNER_TEMP/spec-kit-project"
          specify init --here --force --non-interactive --ignore-agent-tools \
            --integration codex --integration-options="--skills"

      - name: Install and verify Taco
        run: |
          cd "$RUNNER_TEMP/spec-kit-project"
          specify extension add --dev "$GITHUB_WORKSPACE/extensions/taco"
          specify extension list
          test -f .agents/skills/speckit-taco-update/SKILL.md
          test -f .agents/skills/speckit-taco-review/SKILL.md
          for hook in specify clarify plan checklist tasks analyze implement converge; do
            grep -q "after_${hook}:" .specify/extensions.yml
          done
