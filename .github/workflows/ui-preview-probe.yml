name: UI Preview Probe (Disposable)

on:
  pull_request:
    paths:
      - '.github/workflows/scripts/**'
      - '.github/workflows/ui-preview-probe.yml'

permissions: {}

jobs:
  probe:
    name: Run Docker Probe (No Credentials)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Install Playwright in trusted tooling
        run: |
          mkdir -p /tmp/trusted-tools /tmp/outlines-out /tmp/sandbox-out
          cp .github/workflows/scripts/*.mjs .github/workflows/scripts/*.py /tmp/trusted-tools/
          npm install --prefix /tmp/trusted-tools/playwright \
            --no-audit --no-fund --ignore-scripts playwright@1.56.1

      - name: Build and Pack demo in Docker Volume
        run: |
          docker volume create taco-preview-app
          docker run --rm --user 0 --mount type=volume,src=taco-preview-app,dst=/app,volume-nocopy \
            mcr.microsoft.com/playwright:v1.56.1-noble chown -R 1000:1000 /app

          docker run --rm \
            --name taco-preview-build \
            --user "1000:1000" \
            --security-opt "no-new-privileges:true" \
            --cap-drop ALL \
            --pids-limit 1024 \
            --memory "6g" \
            --cpus "2" \
            --env HOME=/home/pwuser \
            --env npm_config_cache=/tmp/npm-cache \
            --env NEXT_TELEMETRY_DISABLED=1 \
            --mount type=volume,src=taco-preview-app,dst=/app,volume-nocopy \
            --volume "$PWD:/src:ro" \
            --workdir /app \
            mcr.microsoft.com/playwright:v1.56.1-noble bash -c '
              set -euo pipefail
              cp -r /src/. /app/
              npm ci --no-audit --no-fund
              npm run build
              npm run --prefix packages/host build
              node extensions/taco/bin/taco.mjs pack demo-spec --output demo-spec/demo-spec.taco.html
            '

      - name: Test Docker Container Network Namespace for Collection
        run: |
          docker run -d \
            --name taco-preview-app-server-collect \
            --network none \
            --user "1000:1000" \
            --security-opt "no-new-privileges:true" \
            --cap-drop ALL \
            --pids-limit 256 \
            --memory "2g" \
            --cpus "1" \
            --env HOME=/home/pwuser \
            --env NEXT_TELEMETRY_DISABLED=1 \
            --mount type=volume,src=taco-preview-app,dst=/app,volume-nocopy,readonly \
            --workdir /app \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            npm run --prefix packages/host start -- --hostname 127.0.0.1 --port 4174

          docker run --rm \
            --name taco-preview-outlines \
            --network container:taco-preview-app-server-collect \
            --user "1000:1000" \
            --security-opt "no-new-privileges:true" \
            --cap-drop ALL \
            --pids-limit 512 \
            --memory "4g" \
            --cpus "2" \
            --env HOME=/home/pwuser \
            --env NEXT_TELEMETRY_DISABLED=1 \
            --mount type=volume,src=taco-preview-app,dst=/app,volume-nocopy,readonly \
            --volume "/tmp/outlines-out:/outlines" \
            --volume "/tmp/trusted-tools:/trusted-tools:ro" \
            --workdir /app \
            mcr.microsoft.com/playwright:v1.56.1-noble bash -c '
              set -euo pipefail
              TACO_FILE="demo-spec/demo-spec.taco.html"
              node /trusted-tools/collect-outlines.mjs \
                --taco-file "$TACO_FILE" \
                --host-url http://127.0.0.1:4174 \
                --out-path /outlines/outlines.json \
                --playwright-module /trusted-tools/playwright/node_modules/playwright \
                --timeout 45000
            '

          docker stop -t 2 taco-preview-app-server-collect || true
          docker rm -f taco-preview-app-server-collect || true

      - name: Stage Replay Plan (Zero Secrets)
        run: |
          mkdir -p /tmp/plan
          node -e '
            import { writeFileSync } from "node:fs";
            const replayPlan = {
              version: 1,
              source: "human-fixture",
              ui_change: true,
              summary: "Probe execution of container network isolation",
              scenes: [
                {
                  id: "probe-scene",
                  title: "Probe Scene",
                  target: "taco",
                  steps: [
                    { do: "open-file", path: "demo-spec/spec.md" },
                    { do: "wait", ms: 800 },
                    { do: "shot", name: "flowchart", caption: "Probe Flowchart" }
                  ]
                }
              ]
            };
            writeFileSync("/tmp/plan/preview-plan.json", JSON.stringify(replayPlan, null, 2));
          '

      - name: Test Docker Container Network Namespace for Capture
        run: |
          docker run -d \
            --name taco-preview-app-server-capture \
            --network none \
            --user "1000:1000" \
            --security-opt "no-new-privileges:true" \
            --cap-drop ALL \
            --pids-limit 256 \
            --memory "2g" \
            --cpus "1" \
            --env HOME=/home/pwuser \
            --env NEXT_TELEMETRY_DISABLED=1 \
            --mount type=volume,src=taco-preview-app,dst=/app,volume-nocopy,readonly \
            --workdir /app \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            npm run --prefix packages/host start -- --hostname 127.0.0.1 --port 4174

          docker run --rm \
            --name taco-preview-capture \
            --network container:taco-preview-app-server-capture \
            --user "1000:1000" \
            --security-opt "no-new-privileges:true" \
            --cap-drop ALL \
            --pids-limit 512 \
            --memory "4g" \
            --cpus "2" \
            --env HOME=/home/pwuser \
            --env NEXT_TELEMETRY_DISABLED=1 \
            --mount type=volume,src=taco-preview-app,dst=/app,volume-nocopy,readonly \
            --volume "/tmp/sandbox-out:/out" \
            --volume "/tmp/trusted-tools:/trusted-tools:ro" \
            --volume "/tmp/plan:/plan:ro" \
            --workdir /app \
            mcr.microsoft.com/playwright:v1.56.1-noble bash -c '
              set -euo pipefail
              TACO_FILE="demo-spec/demo-spec.taco.html"
              node /trusted-tools/execute-preview.mjs \
                --plan-file /plan/preview-plan.json \
                --taco-file "$TACO_FILE" \
                --host-url http://127.0.0.1:4174 \
                --out-dir /out \
                --playwright-module /trusted-tools/playwright/node_modules/playwright \
                --timeout 45000
            '

          docker stop -t 2 taco-preview-app-server-capture || true
          docker rm -f taco-preview-app-server-capture || true

      - name: Build Sanitizer and Sanitize PNGs
        run: |
          mkdir -p /tmp/sanitizer-context
          printf '%s\n' \
            'FROM python:3.12-slim' \
            'RUN pip install --no-cache-dir --disable-pip-version-check Pillow==12.3.0' \
            > /tmp/sanitizer-context/Dockerfile
          docker build --tag taco-preview-sanitizer /tmp/sanitizer-context
          docker run --rm \
            --name taco-preview-sanitize \
            --network none \
            --user "1000:1000" \
            --security-opt "no-new-privileges:true" \
            --cap-drop ALL \
            --pids-limit 128 \
            --memory "1g" \
            --cpus "1" \
            --volume "/tmp/sandbox-out:/out" \
            --volume "/tmp/trusted-tools:/trusted-tools:ro" \
            --workdir /out \
            taco-preview-sanitizer python3 /trusted-tools/sanitize-preview-png.py \
              --dir /out \
              --expected /out/manifest.json

      - name: Validate with trusted plan
        run: node /tmp/trusted-tools/validate-preview-png.mjs --dir /tmp/sandbox-out --plan /tmp/plan/preview-plan.json
