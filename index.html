    <style>
      #taco-splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:12px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#f4f1ea;color:#20211f;font:600 14px/1.4 system-ui;transition:opacity .22s cubic-bezier(.23,1,.32,1)}
      #taco-splash.is-leaving{opacity:0;pointer-events:none}
      .splash-mark{display:grid;place-items:center;width:68px;height:68px}.splash-mark svg{display:block;width:68px;height:68px;overflow:visible;filter:drop-shadow(0 16px 24px rgba(26,38,35,.18))}
      .splash-bubble{transform-box:fill-box;transform-origin:center;animation:splash-bounce .9s cubic-bezier(.45,0,.55,1) infinite}.splash-bubble-secondary{animation-delay:-.15s}.splash-bubble-tertiary{animation-delay:-.3s}
      .splash-word{font:700 22px Georgia,serif}.splash-sub{color:#676962;font-weight:450}
      .splash-progress{width:180px;height:4px;margin-top:8px;overflow:hidden;border-radius:999px;background:rgba(32,33,31,.1)}.splash-progress-bar{width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3b82f6,#3ecf8e 55%,#f97316);transform:translateX(-120%);animation:splash-progress 1.1s linear infinite}
      .splash-loading{color:#676962;font-size:11px;font-weight:550;letter-spacing:.08em;text-transform:uppercase}
      @keyframes splash-bounce{0%,55%,100%{transform:translateY(0)}27%{transform:translateY(-3px)}}
      @keyframes splash-progress{to{transform:translateX(340%)}}
      @media(prefers-reduced-motion:reduce){#taco-splash{transition:none}.splash-bubble,.splash-progress-bar{animation:none}.splash-progress-bar{width:100%;transform:none;background:#3ecf8e}}
    </style>
